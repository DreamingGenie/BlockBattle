services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: block_battle
      MYSQL_USER: block_battle
      MYSQL_PASSWORD: block_battle
      MYSQL_ROOT_PASSWORD: block_battle_root
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      # 이 PC에서만 접속한다(공용망에서 DB·Redis가 밖으로 열리지 않게, 보안 점검 L-17). 로컬에 MySQL이 이미 있으면 MYSQL_PORT=3307 처럼 바꾼다
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
