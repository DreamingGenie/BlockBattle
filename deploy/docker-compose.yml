# 운영 배포(T-29): EC2 1대에 MySQL·Redis·백엔드·AI·nginx. 외부에는 nginx의 80·443만 연다.
# 비밀값은 같은 폴더의 .env(서버에서만 만든다, .env.example 참고)에서 읽는다.
name: block-battle

# 컨테이너 상한(T-33, 보안 점검 H-3): 4GB 서버 한 대에서 한 서비스가 커져 OOM killer가 다른 프로세스를 죽이지 않게
# 메모리를 나눠 둔다(합계 약 2.9GB, 실측 MySQL 약 495MB·JVM 약 390MB·AI 약 30MB보다 여유). 로그는 서비스마다 10MB × 3개까지.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    environment:
      MYSQL_DATABASE: block_battle
      MYSQL_USER: block_battle
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=256M"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    # 메모리 상한(T-34, 보안 점검 H-3): 모든 키에 TTL이 있어(방 30분·Refresh 7일) volatile-lru가 맞다.
    # 진행 중인 방 키는 lock마다 읽혀 가장 늦게 지워지고, 오래 안 쓴 Refresh·쉬는 방 키부터 지워진다.
    # noeviction은 상한에서 모든 쓰기를 거부해 진행 중 경기의 lock까지 실패하므로 쓰지 않는다.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    mem_limit: 1200m   # JVM -Xmx768m(backend/Dockerfile) + 메타스페이스·스레드 스택 등 힙 밖 메모리
    logging: *default-logging
    environment:
      DB_URL: jdbc:mysql://mysql:3306/block_battle?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: block_battle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      PUBLIC_BASE_URL: https://${PUBLIC_HOST:?PUBLIC_HOST}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: ..
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0          # AI 계산이 몰려도 2 vCPU 중 하나는 백엔드·DB에 남긴다
    logging: *default-logging
    environment:
      JWT_SECRET: ${JWT_SECRET}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - ai

volumes:
  mysql-data:
  redis-data:
