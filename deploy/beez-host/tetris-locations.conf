# 블록 배틀 /tetris (2026-11-19 ~ 11-20 임시). dev.beez.ai.kr 443 server 블록 안에서 include 한다(/etc/nginx/snippets/).
# 앞의 /tetris 를 떼고 블록 배틀 backend(127.0.0.1:18080)·ai(127.0.0.1:18000)로 넘긴다. 프론트는 VITE_BASE_PATH=/tetris/ 로 빌드한다.
# backend는 Refresh 쿠키를 Path=/api/v1/auth로 주므로 브라우저가 /tetris/api/... 요청에 붙이도록 proxy_cookie_path로 바꾼다.
# /tetris/ 아래는 BEEZ의 /api/·/assets/ prefix와 겹치지 않는다. 정적 파일·ws·ai는 ^~ 로 정규식보다 먼저 고른다. deploy/beez-host.sh down 이 include 줄과 이 파일을 지운다.

location = /tetris {
    return 301 /tetris/;
}

location = /tetris/api/v1/auth/guest {
    limit_req zone=tetris_guest burst=50 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18080/api/v1/auth/guest;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /api/ /tetris/api/;
}

location ~ ^/tetris/api/v1/(rooms|matches)$ {
    limit_req zone=tetris_create burst=20 nodelay;
    limit_req_status 429;
    rewrite ^/tetris(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /api/ /tetris/api/;
}

location /tetris/api/ {   # ^~ 를 붙이면 위 정규식(방·경기 생성 한도)이 건너뛰어진다
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /api/ /tetris/api/;
}

# STOMP over WebSocket. 하트비트(서버 10초·클라이언트 25초)가 오가므로 90초 넘게 조용하면 죽은 연결이다
location ^~ /tetris/ws {
    limit_conn tetris_ws 60;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:18080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ^~ /tetris/ai/ {
    limit_req zone=tetris_ai burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18000/ai/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /tetris/assets/ {
    alias /var/www/tetris/current/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 화면은 해시 라우터. 초대 링크(/tetris/room/{code})처럼 파일이 없는 경로도 index.html을 준다
location ^~ /tetris/ {
    alias /var/www/tetris/current/;
    try_files $uri /tetris/index.html;
    add_header Cache-Control "no-cache";
}
