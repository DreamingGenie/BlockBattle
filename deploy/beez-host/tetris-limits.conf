# 블록 배틀 /tetris 요청 한도(http 영역, /etc/nginx/conf.d/에 둔다). deploy/nginx.conf.template의 H-3 값과 같다.
# 이름은 BEEZ 설정과 겹치지 않게 tetris_ 로 시작한다. deploy/beez-host.sh down 이 지운다.
map $request_method $tetris_create_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone  $binary_remote_addr zone=tetris_guest:10m  rate=30r/m;
limit_req_zone  $tetris_create_key  zone=tetris_create:10m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=tetris_ai:10m     rate=20r/s;
limit_conn_zone $binary_remote_addr zone=tetris_ws:10m;
