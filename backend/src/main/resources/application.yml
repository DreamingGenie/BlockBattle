spring:
  application:
    name: block-battle
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/block_battle?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:block_battle}
    password: ${DB_PASSWORD:block_battle}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
